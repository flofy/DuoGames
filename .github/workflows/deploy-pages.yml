name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Optionnel : adresse du Worker multi-appareils si le site n'est pas servi
      # par Cloudflare (variable de dépôt PARTY_HOST, ex. mon-worker.workers.dev).
      - run: npm run build
        env:
          VITE_PARTY_HOST: ${{ vars.PARTY_HOST }}
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
