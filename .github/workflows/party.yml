name: Deploy Party worker

# Déploie le Worker Cloudflare (mode multi-appareils) quand son code change.
# Le job ne s'exécute que si la variable de dépôt PARTY_DEPLOY vaut « true » :
# sans compte Cloudflare configuré, le dépôt reste utilisable tel quel.
#
# Secrets requis (Settings → Secrets and variables → Actions) :
#   CLOUDFLARE_API_TOKEN   (permission « Edit Cloudflare Workers »)
#   CLOUDFLARE_ACCOUNT_ID
# Variable requise :
#   PARTY_DEPLOY = true

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'src/lib/net/**'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/party.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: party-worker
  cancel-in-progress: false

jobs:
  deploy:
    name: wrangler deploy
    if: ${{ vars.PARTY_DEPLOY == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run test
      - run: npm run build

      - name: Vérifier le bundle (sans publier)
        run: npm run party:check

      - name: Déployer sur Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
